{% from 'ui.html' import badge, csrf with context %}
<div class="table-wrap"><table><thead><tr><th>Checker</th><th>Schedule</th><th>Next check</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
{% for job in jobs %}<tr><td class="checker-name">{{ job.name }}</td><td class="mono">{{ job.trigger }}</td><td>{{ job.next_run if job.status == 'Scheduled' else 'Not scheduled' }}</td><td>{{ badge(job.status) }}</td><td><form action="{{ url_for('force_run_job', job_name=job.id) }}" method="post">{{ csrf() }}<button class="button secondary small-button">Run now</button></form></td></tr>{% endfor %}
</tbody></table></div>
