name: Check yt-dlp Releases

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check for Latest yt-dlp Release
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_release=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -er .tag_name)
          echo "Latest release is $latest_release"
          echo "tag=$latest_release" >> "$GITHUB_OUTPUT"

      - name: Restore saved release
        uses: actions/cache/restore@v4
        with:
          path: .cache/yt-dlp-latest
          key: yt-dlp-${{ steps.check_release.outputs.tag }}
          restore-keys: yt-dlp-

      - name: Compare releases
        id: compare
        env:
          LATEST_RELEASE: ${{ steps.check_release.outputs.tag }}
        run: |
          saved_release=$(cat .cache/yt-dlp-latest 2>/dev/null || true)
          if [ "$LATEST_RELEASE" != "$saved_release" ]; then
            mkdir -p .cache
            echo "$LATEST_RELEASE" > .cache/yt-dlp-latest
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save latest release
        if: steps.compare.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/yt-dlp-latest
          key: yt-dlp-${{ steps.check_release.outputs.tag }}

      - name: Trigger Docker Image CI
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.check_release.outputs.tag }}
        run: |
          curl --fail-with-body --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            --data "$(jq -n --arg tag "$RELEASE_TAG" '{event_type: "yt-dlp_release_update", client_payload: {tag: $tag}}')"
